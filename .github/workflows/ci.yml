name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php: '8.4'
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-text

  screenshots:
    name: Update component screenshots
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
        working-directory: docs/screenshots

      - name: Install Chromium
        run: npx puppeteer browsers install chrome@stable

      - name: Generate screenshots
        run: |
          php docs/screenshots/render-components.php
          cd docs/screenshots
          CHROME_PATH=$(find $HOME/.cache -name "chrome" -type f | head -1) node capture.mjs

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/png/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Update component screenshots [ci skip]"
            git push
          fi
